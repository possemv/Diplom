services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: diplom
      POSTGRES_USER: diplom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diplom -d diplom"]
      interval: 5s
      retries: 10

  web:
    build: .
    image: ghcr.io/${GHCR_OWNER:-local}/diplom-web:latest
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_NAME: diplom
      DB_USER: diplom
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - web

volumes:
  pgdata:
  uploads:
  caddy_data: